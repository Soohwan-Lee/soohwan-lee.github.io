    image: /files/cmfHowDataset.png
    cover: true
    tags: [NLP Analysis, Recommendation, Prototyping]
    desc: >-
      Mapping the affective vocabulary designers actually use onto KIDP's CMF How
      dataset, so that a designer can describe a feeling and get back the color,
      material and finish specimens that carry it. My part: quantifying the collected
      affective language with NLP (180 specimens, 112 participants, 4,032 free-text
      responses), turning that analysis into design implications, and prototyping the
      interactive recommendation system.
    funders:
