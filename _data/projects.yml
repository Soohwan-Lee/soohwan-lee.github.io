research:

  - title: AI Proxy Agents for Negotiation under Power Imbalance
    image: /files/AI-mediated-Negotiation.png
    year: 2026
    theme: gcai
    modality: llm
    badge: { label: Under Review, style: review }
    tags: [AI-mediated Negotiation]
    desc: >-
      Comparing direct negotiation with user-specified and AI-supplemented proxy agents
      that negotiate on behalf of a leader and a member, to see whether AI-mediated
      reasons rebalance power asymmetry.
    papers:
      - type: Under Review
        items:
          - { venue: Conference, style: review, title: AI-mediated negotiation with proxy agents in power-imbalanced groups }

  - title: Multi-agent Systems and Social Influence
    image: /files/multiagent-influence.png
    link: https://doi.org/10.1145/3772318.3790385
    year: 2026
    theme: gcai
    modality: llm
    badge: { label: "CHI '26", style: chi }
    tags: [Multi-agent · Social Influence]
    desc: >-
      How multiple LLM agents establish and exercise social influence in groups, seen
      through Moscovici's Social Conversion Theory: can a consistent minority voice
      shift the majority?
    papers:
      - type: Full Paper
        items:
          - { venue: "CHI '26", style: chi, title: "Understanding Compliance and Conversion Dynamics in Multi-Agent Collectives (CHI '26)", url: "https://doi.org/10.1145/3772318.3790385" }
      - type: Workshop
        items:
          - { venue: "CHI '26", style: chi, title: "Multi-Agent Consensus as a Cognitive Bias Trigger in Human-AI Interaction (CHI '26 Bias4Trust Workshop)", url: "https://arxiv.org/abs/2604.22277" }
    links:
      - { label: Talk, url: "https://www.youtube.com/watch?v=c2_R4BPfIXw&t=253s" }

