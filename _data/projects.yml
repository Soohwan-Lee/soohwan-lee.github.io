# =====================================================================
#  PROJECTS PAGE DATA
#  Rendered by _pages/portfolio.md using _includes/project-card.html.
#  Edit this file only; no HTML needed.
#
#  HOW TO ADD A PROJECT
#    1. Put a png/jpg in /files/.
#    2. Copy one entry under "research:" (or "funded:") and edit it.
#    3. New entries can go anywhere in the list; "Latest" sorts research
#       cards by "year" (newest first, ties keep this file's order).
#
#  CARD FIELDS  (only "title" is required)
#    title     : card title
#    image     : /files/xxx.png            (omit -> icon placeholder)
#    icon      : font-awesome name for the placeholder, e.g. "microphone"
#    cover     : true = crop photo to fill the box (default: show whole image)
#    link      : URL for the image and title (DOI, arXiv, video, pdf ...)
#    badge     : { label: "CHI '26", style: chi }
#                styles: chi cscw dis iui journal thesis domestic review
#    tags      : ["short topic", "another"]
#    desc      : one or two sentences (shown on hover / inline on touch)
#    funders   : small chips naming who funded the work
#                - { label: "LG Electronics" }
#                - { label: "MOTIE, Korea", logo: /files/government.png }
#                "logo" is optional. It is drawn on a white tile about 1.7x
#                the chip's text height, so a square, text-free mark with a
#                transparent background works best.
#    note      : small gray line under the chips - programme and period
#    papers    : rows of related papers, grouped by type
#                - type: "Full Paper"
#                  items:
#                    - { venue: "CHI '26", style: chi, title: "Full title", url: "https://doi.org/..." }
#                  (omit "url" for papers under review; the pill is then not clickable)
#    links     : [{ label: Talk, url: "https://..." }, { label: "Creative Award", award: true }]
#                "award: true" styles the pill as an award; it may carry a url too.
#
#  RESEARCH-ONLY FIELDS (drive the Latest / Theme / Modality toggle)
#    year      : 2026
#    theme     : one or more "key"s from views -> theme
#    modality  : one or more "key"s from views -> modality
#    Both take a single key (theme: gcai) or a list (theme: [gcai, embodied]).
#    A card listed in several groups appears under each of them. A card whose
#    value matches no group is shown under "Other", never hidden.
#
#  VIEWS
#    Each entry below becomes a toggle button. "key" is also the card field
#    it reads. Add a new grouping by adding a view here and giving every
#    research card that field.
# =====================================================================

views:
  - key: theme
    label: Theme
    groups:
      - key: gcai
        title: Group-Centered AI
        desc: "Core Ph.D. line: how AI and interactive systems reshape group processes - social influence, minority voices, coordination, and collective experience"
      - key: reflection
        title: AI-Augmented Reflection
        desc: Visualization and LLM-generated feedback that help people revisit what was said, decided, and left unsaid
      - key: embodied
        title: Embodied & Gestural Interaction
        desc: Vision-based feedback, mid-air gestures, and wearable sensing for expressive and coordinated interaction
      - key: critical
        title: Critical & Speculative Design
        desc: Artifacts built to question everyday interaction rather than optimize it
      - key: media
        title: Interactive Media Art
        desc: Performative installations that turn embodied expression into real-time visuals

  - key: modality
    label: Modality
    groups:
      - key: llm
        title: LLM Agents & Conversational AI
        desc: Multi-agent systems, AI proxies, and LLM-generated feedback in group settings
      - key: body
        title: Body Movement
        desc: Camera-based pose and gesture estimation for group synchrony, performance feedback, and non-verbal expression
      - key: hand
        title: Hand Gesture & Touch
        desc: Mid-air gestures, hand tracking, and on-body touch input
      - key: theory
        title: Theory & Frameworks
        desc: Conceptual work without a specific input modality

# ---------------------------------------------------------------------
research:

  - title: AI Proxy Agents for Negotiation under Power Imbalance
    image: /files/AI-mediated-Negotiation.png
    link: https://github.com/Soohwan-Lee/AI-Mediated-Negotiation-Experiment
    year: 2026
    theme: gcai
    modality: llm
    badge: { label: Under Review, style: review }
    tags: [AI-mediated Negotiation]
    desc: >-
      Comparing direct negotiation with user-specified and AI-supplemented proxy agents
      that negotiate on behalf of a leader and a member, to see whether AI-mediated
      reasons rebalance power asymmetry - and what they cost the person who sends them.
    papers:
      - type: Under Review
        items:
          - { venue: Conference, style: review, title: "Investigating AI Proxies and the Social Costs of Explaining Requests in Power-Imbalanced Workplace Negotiation" }
      - type: Workshop
        items:
          - { venue: "CSCW '26", style: cscw, title: "Delivered but Not Heard: AI Proxy Speech in Power-Imbalanced Group Decision-Making (CSCW '26 Workshop, Oral Presentation)" }
    links:
      - { label: System, url: "https://github.com/Soohwan-Lee/AI-Mediated-Negotiation-Experiment" }

